# Shipped default. Worker user is compiled in (--user=angie); a `user`
# directive here is unnecessary and ops configs cannot accidentally lose the
# privilege drop by omitting it.
worker_processes auto;

events {}

http {
    # Keep the version out of the Server header and error pages. The
    # ssl_protocols value matches angie's current default; it is spelled
    # out because implicit defaults drift with upstream.
    server_tokens off;
    ssl_protocols TLSv1.2 TLSv1.3;

    # $ssl_encrypted_hello is the server-side witness for ECH acceptance.
    log_format main '$remote_addr "$request" status=$status '
                    'proto=$server_protocol ech=$ssl_encrypted_hello';
    access_log /dev/stdout main;

    include /etc/angie/http.d/*.conf;
}
