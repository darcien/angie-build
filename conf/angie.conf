worker_processes 1;

events {}

http {
    # $ssl_encrypted_hello is the server-side witness for ECH acceptance.
    log_format testbed '$remote_addr "$request" status=$status '
                       'proto=$server_protocol ech=$ssl_encrypted_hello';
    access_log /dev/stdout testbed;

    server {
        listen 8443 ssl;
        listen 8443 quic reuseport;

        server_name testbed.local;

        ssl_certificate     /etc/angie/certs/server.crt;
        ssl_certificate_key /etc/angie/certs/server.key;

        # Combined PEM: PKCS#8 private key + ECHConfigList, generated in the
        # Dockerfile builder stage (format verified against angie source and
        # a live bssl-client handshake).
        ssl_encrypted_hello_key /etc/angie/certs/ech.key;

        add_header Alt-Svc 'h3=":8443"; ma=86400' always;

        location / {
            return 200 "angie testbed: proto=$server_protocol ech=$ssl_encrypted_hello\n";
        }
    }
}
