# Default TLS server. Certificates are ops-supplied — mount at
# /etc/angie/certs (server.crt + server.key); the image ships no keys and
# will not start without them. ECH is deploy-time config: mount an http.d
# conf adding ssl_encrypted_hello_key next to the mounted key.
server {
    listen 443 ssl;
    listen 443 quic reuseport;

    ssl_certificate     /etc/angie/certs/server.crt;
    ssl_certificate_key /etc/angie/certs/server.key;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    location / {
        return 200 "angie: proto=$server_protocol ech=$ssl_encrypted_hello\n";
    }
}
