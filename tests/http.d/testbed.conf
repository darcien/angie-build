# Harness config, mounted over /etc/angie/http.d (hides the shipped
# default.conf). Same server shape as the default plus ECH — proves the
# deploy-time ECH flow the image is designed for.
server {
    listen 443 ssl;
    listen 443 quic reuseport;

    server_name testbed.local;

    ssl_certificate     /etc/angie/certs/server.crt;
    ssl_certificate_key /etc/angie/certs/server.key;

    # Combined PEM: PKCS#8 private key + ECHConfigList, generated by
    # tests/test.sh via the builder images at test time.
    ssl_encrypted_hello_key /etc/angie/certs/ech.key;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    # Machine witness — the harness greps only this; page format is free to
    # change without breaking tests.
    location /status {
        return 200 "proto=$server_protocol ech=$ssl_encrypted_hello\n";
    }

    location / {
        return 200 "angie testbed: proto=$server_protocol ech=$ssl_encrypted_hello\n";
    }
}
